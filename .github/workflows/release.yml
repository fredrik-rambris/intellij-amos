name: Release plugin on tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build plugin ZIP
        run: ./gradlew buildPlugin

      - name: Read tagged commit message and locate ZIP
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          subject="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%b)"

          if [ -z "$body" ]; then
            body="$subject"
          fi

          zip_path="$(find build/distributions -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$zip_path" ]; then
            echo "No plugin ZIP found in build/distributions" >&2
            exit 1
          fi

          {
            echo "title<<EOF"
            echo "$subject"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ steps.prep.outputs.title }}
          RELEASE_BODY: ${{ steps.prep.outputs.body }}
          ZIP_PATH: ${{ steps.prep.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "$RELEASE_BODY" > release-notes.txt

          if [[ "$TAG_NAME" == *-* ]]; then
            gh release create "$TAG_NAME" "$ZIP_PATH" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.txt \
              --prerelease
          else
            gh release create "$TAG_NAME" "$ZIP_PATH" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.txt
          fi